services:
  - type: web
    name: clinical-trial-evidence-assistant
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5
      - key: ZOTERO_CLIENT_KEY
        value: "fd92d01e52ac458a752e"
      - key: ZOTERO_CLIENT_SECRET
        sync: false
      - key: APP_BASE_URL
        value: "https://trial-ledger.onrender.com"
      - key: SESSION_SECRET
        sync: false
