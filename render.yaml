services:
  - type: web
    name: clinical-trial-evidence-assistant
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5
      - key: NCBI_EMAIL
        sync: false
      - key: NCBI_API_KEY
        sync: false
